name: CI

# test:    every push and PR to develop and main.
# image:   builds the native image for amd64 and arm64, each on a runner of its own architecture,
#          and smoke-tests it, on PRs to main, on main and on v* tags.
# publish: from main (latest, sha-<short>) and tags vX.Y.Z (X.Y.Z), joins both into one
#          multi-arch tag on Quay.
on:
  push:
    branches: [ develop, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: quay.io/fruityhedgehog/lyfia

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw verify -B

  image:
    needs: test
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    # A native image is machine code: each architecture is built natively, never emulated
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    # What the image talks to in production, for the smoke test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lyfia
          POSTGRES_USER: lyfia
          POSTGRES_PASSWORD: lyfia
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U lyfia" --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4
        ports: [ '5672:5672' ]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build the native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: lyfia:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # Starts the image as in production: Flyway migrates PostgreSQL, Hibernate validates the
      # entities against it, the RabbitMQ listener connects. OIDC and Keycloak are never reached.
      - name: Smoke test
        run: |
          docker run -d --name lyfia --network host \
            -e QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://localhost:5432/lyfia \
            -e QUARKUS_DATASOURCE_USERNAME=lyfia \
            -e QUARKUS_DATASOURCE_PASSWORD=lyfia \
            -e RABBITMQ_HOST=localhost \
            -e RABBITMQ_PORT=5672 \
            -e RABBITMQ_USERNAME=guest \
            -e RABBITMQ_PASSWORD=guest \
            -e RABBITMQ_VIRTUAL_HOST=/ \
            -e QUARKUS_OIDC_AUTH_SERVER_URL=http://localhost:1/realms/smoke \
            -e QUARKUS_OIDC_CLIENT_ID=smoke \
            -e QUARKUS_OIDC_CREDENTIALS_SECRET=smoke \
            -e QUARKUS_KEYCLOAK_ADMIN_CLIENT_SERVER_URL=http://localhost:1 \
            -e QUARKUS_KEYCLOAK_ADMIN_CLIENT_REALM=smoke \
            -e QUARKUS_KEYCLOAK_ADMIN_CLIENT_CLIENT_ID=smoke \
            -e QUARKUS_KEYCLOAK_ADMIN_CLIENT_CLIENT_SECRET=smoke \
            lyfia:smoke

          for i in $(seq 30); do
            curl -fsS http://localhost:8080/q/health && break
            [ "$(docker inspect -f '{{.State.Running}}' lyfia)" = true ] || break
            sleep 2
          done
          curl -fsS http://localhost:8080/q/health
          # The site, at the root and through a deep link
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/connexion
          # Public endpoints read the database through Hibernate and Jackson in native mode
          curl -fsS -o /dev/null http://localhost:8080/api/groups
          curl -fsS -o /dev/null http://localhost:8080/api/events

      - name: Smoke test logs
        if: failure()
        run: docker logs lyfia

      - name: Log in to Quay
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Untagged: the publish job tags both architectures together. Same build, so all from cache.
      - name: Push by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Tag both architectures
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
