quarkus.quinoa.package-manager-install.node-version=22.20.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=quinoa
#quarkus.ssl.native=true

#DB Config
quarkus.datasource.jdbc.url=<TO BE PROVIDED>
quarkus.hibernate-orm.schema-management.strategy=update

#OIDC Configuration
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=<TO BE PROVIDED>
quarkus.oidc.credentials.secret=<TO BE PROVIDED>
quarkus.oidc.application-type=web-app
quarkus.oidc.client-id=<TO BE PROVIDED>
urue.oidc.queue.client-id=<TO BE PROVIDED>

#Keycloak admin client: mirrors each Role change to the group named after the Role id (ADR 0002)
quarkus.keycloak.admin-client.server-url=<TO BE PROVIDED>
quarkus.keycloak.admin-client.realm=<TO BE PROVIDED>
quarkus.keycloak.admin-client.client-id=<TO BE PROVIDED>
quarkus.keycloak.admin-client.client-secret=<TO BE PROVIDED>
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS


# API access: authentication required on /api/* whenever OIDC is enabled
# (replaces the former per-service *AuthProxy decorators)
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.api.enabled=${quarkus.oidc.enabled}

# Visiteurs see the Groupes without logging in
quarkus.http.auth.permission.public-groups.paths=/api/groups
quarkus.http.auth.permission.public-groups.methods=GET
quarkus.http.auth.permission.public-groups.policy=permit
quarkus.http.auth.permission.public-groups.enabled=${quarkus.oidc.enabled}
# Same path, other methods: without this, Quarkus denies them outright
quarkus.http.auth.permission.groups-write.paths=/api/groups
quarkus.http.auth.permission.groups-write.methods=POST,PATCH
quarkus.http.auth.permission.groups-write.policy=authenticated
quarkus.http.auth.permission.groups-write.enabled=${quarkus.oidc.enabled}

#Rabbit Config
rabbitmq.username=<TO BE PROVIDED>
rabbitmq.password=<TO BE PROVIDED>
rabbitmq.host=<TO BE PROVIDED>
rabbitmq.port=
rabbitmq.virtual.host=<TO BE PROVIDED>

#Rabbit Queue Config
rabbitmq.exchange=keycloak
rabbitmq.queue.user-listener=urue.keycloak.events.user
rabbitmq.routing.user-created=user.create
rabbitmq.routing.user-updated=user.update
rabbitmq.routing.user-deleted=user.delete
