quarkus.quinoa.package-manager-install.node-version=22.20.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=quinoa
#quarkus.ssl.native=true

# DB Config
quarkus.datasource.jdbc.url=<TO BE PROVIDED>
quarkus.hibernate-orm.schema-management.strategy=update

# OIDC Configuration
quarkus.oidc.enabled=false
quarkus.oidc.auth-server-url=<TO BE PROVIDED>
quarkus.oidc.client-id=<TO BE PROVIDED>
quarkus.oidc.credentials.secret=<TO BE PROVIDED>
quarkus.oidc.application-type=web-app

#Rabbit Config
rabbitmq.username=<TO BE PROVIDED>
rabbitmq.password=<TO BE PROVIDED>
rabbitmq.host=<TO BE PROVIDED>
rabbitmq.port=
rabbitmq.virtual.host=<TO BE PROVIDED>

#Rabbit Queue Config
rabbitmq.exchange=keycloak
rabbitmq.queue.user-listener=urue.keycloak.events.user
rabbitmq.routing.user-created=user.create
rabbitmq.routing.user-updated=user.update
rabbitmq.routing.user-deleted=user.delete
